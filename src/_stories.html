<!-- Historias completas. Se abren en una ventana sobre la página (data-story="clave"), sin cambiar de página.
     build.py agrega a cada página solo las historias que esa página usa. -->

<template id="story-mitu">
<article class="story-sheet">
  <div class="pc" data-pc aria-label="Fotos de la historia De Mitú al mundo">
    <div class="pc-track">
      <figure class="pc-slide"><img src="assets/img/mitu-aeropuerto2.webp" alt="Joven de Mitú con la chaqueta de la delegación en el aeropuerto internacional" style="object-position:center 25%"></figure>
      <figure class="pc-slide"><img src="assets/img/mitu-avion.webp" alt="Jóvenes de Mitú en el avión rumbo a su primer torneo internacional"></figure>
      <figure class="pc-slide"><img src="assets/img/mitu-medallas.webp" alt="Los jóvenes de Mitú con sus medallas en Mérida"></figure>
      <figure class="pc-slide"><img src="assets/img/mitu-merida.webp" alt="Jóvenes de la delegación con sus medallas en el estadio de Mérida" style="object-position:center 40%"></figure>
      <figure class="pc-slide"><img src="assets/img/vaupes-grupo.webp" alt="Jóvenes del club Seven Vaupés F.C. en Mitú"></figure>
    </div>
  </div>
  <div class="story-txt">
    <span class="eyebrow">Historia · Vaupés → México</span>
    <h2 class="h-lg" id="st-mitu">De Mitú al mundo</h2>
    <p class="lead">Dos jóvenes del club Seven Vaupés F.C. crecieron en Mitú, en plena Amazonía colombiana, donde las oportunidades de deporte estructurado, formación y competencia casi no existen.</p>
    <div class="prose">
      <p>Ambos hacían parte de los 35 jóvenes del club. Tras los procesos de evaluación, fueron invitados a Bogotá para pruebas de alto rendimiento: entrenaron con los demás integrantes de la Fundación, compartieron espacios de convivencia y se ganaron un lugar en la delegación.</p>
      <p>En noviembre de 2025 tomaron un vuelo internacional por primera vez. En Mérida, Yucatán, fueron parte de una delegación que regresó con tres títulos.</p>
    </div>
    <blockquote>“Esta experiencia representa el verdadero propósito de nuestra labor: usar el fútbol como herramienta de transformación social.”<small>Informe de gestión 2025</small></blockquote>
  </div>
</article>
</template>

    <p class="lead">La mejor semana del año: una delegación de Bogotá, Mitú, Boyacá y Medellín volvió de México con tres títulos.</p>
    <ul class="tally">
      <li class="gold">Selección Colombia <b>Campeón</b></li>

      <p>Acompañamos a la Selección Colombia de Fútbol 7 y a las categorías Sub-13, Sub-15, Sub-17 y Única. Antes, apoyamos la convocatoria para que jóvenes de distintas regiones pudieran representar al país; entre ellos viajaron dos jóvenes de Seven Vaupés F.C., que tomaron un avión por primera vez.</p>
    </div>

    <div class="prose">
      <p>En Mitú, en plena Amazonía, conseguir útiles escolares puede ser difícil para muchas familias. En febrero de 2026 entregamos más de 150 kits a niños, niñas y adolescentes de distintas comunidades, y en mayo llegaron 20 más.</p>
      <p>Luego, en alianza con <strong>Nestlé</strong>, gestionamos 110 pares de zapatos para niños de Mitú y Pereira: lo básico para llegar al colegio.</p>

  <div class="story-txt">
    <span class="eyebrow">Historia · Chocó · Agosto 2026</span>
    <h2 class="h-lg" id="st-choco">15 toneladas de solidaridad</h2>
    <div class="prose">
      <p>El 10 de agosto de 2026 un sismo de magnitud 7,4 golpeó San José del Palmar, en el Chocó, un departamento que ya enfrentaba la pobreza más alta del país. La Fundación habilitó un centro de acopio en Bogotá entre el 17 y el 21 de agosto, y el 23 de agosto abrió un segundo en el Polideportivo del barrio Simón Bolívar, junto a las Escuelas deportivas R8R Rafa Robayo y la Fundación Artistas Fútbol Club.</p>
      <p>Más de 30 voluntarios recibieron, clasificaron y empacaron las donaciones. Luego viajaron en camión y lancha hasta comunidades de San Juan, Río Pepé y Baudó para entregarlas familia por familia.</p>
      <p><strong>Allí, en el Pacífico, empieza nuestro próximo club: Seven Chocó.</strong></p>
    </div>
    <div class="stat-row"><div><b>8 t+</b><span>primer centro de acopio</span></div><div><b>7 t+</b><span>jornada Simón Bolívar</span></div><div><b>30+</b><span>voluntarios</span></div></div>
  </div>
